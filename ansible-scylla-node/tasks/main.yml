---
# Sanity checking
- name: Verify that 'scylla_version' is defined
  fail:
    msg: "scylla_version must be defined!"
  when: scylla_version is not defined

# Facts gathering
- name: Populate service facts
  service_facts:

- name: Populate package facts
  package_facts:
    manager: auto

- block:
  - name: "main.yml: include ScyllaDB version check task"
    include_tasks: version_check.yml

  - name: Set a repository URL if not explicitly set
    include_tasks: set_default_repo.yml

  # Upgrade
  - name: Upgrade Scylla
    include_tasks: upgrade/main.yml
    when: upgrade_version

  # Install
  - name: os-specific tasks
    include_tasks: "{{ ansible_os_family }}.yml"
    when: not upgrade_version

  - name: common tasks
    include_tasks: common.yml
    when: not upgrade_version and install_only|bool == false
    # scylla_yaml_params also has to be on this include itself, not just on
    # the task inside common.yml -- a dynamic include's own tags gate whether
    # Ansible descends into it at all, so an untagged include here would cut
    # --tags scylla_yaml_params off before it ever reaches that task.
    tags: [scylla_yaml_params]
  
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: "{{ apt_lock_timeout }}"

