---
- name: Validate that all nodes are up before adjusting the replication
  uri:
    url: "http://{{ scylla_api_address }}:{{ scylla_api_port }}/failure_detector/endpoints/"
    follow_redirects: none
    method: GET
  register: _result
  until: _result.status == 200
  retries: 10
  delay: 1

- name: Get datacenter name
  uri:
    url: "http://{{ scylla_api_address }}:{{ scylla_api_port }}/snitch/datacenter"
    method: GET
  register: _datacenter_out
  until: _datacenter_out.status == 200
  retries: 5
  delay: 1

- name: Prepare per DC replication_factor list
  set_fact:
    dcs_to_rf: "{{ dcs_to_rf | default([]) + [\"'\" + hostvars[item]['_datacenter_out'].json + \"':\" + _keyspace_rf|string] }}"
  loop: "{{ groups['scylla'] }}"
  run_once: true

- set_fact:
    scylla_admin_username: "{{ scylla_admin_default_user }}"
    scylla_admin_password: "{{ lookup('ini', scylla_admin_default_user, section='cql_credentials', allow_no_value=true, default=omit, file=inventory_file) }}"
  when: scylla_admin_default_user is defined and 'cql_credentials' in groups

- fail:
    msg: "Make sure that {{ scylla_admin_default_user }} is defined in the 'cql_credentials' section"
  when: scylla_admin_default_user is defined and scylla_admin_password is not defined

# Without 'scylla_admin_default_user' there are no credentials to log in with: starting from
# ScyllaDB 2026.2 enabling authentication no longer creates a default 'cassandra' superuser, so we
# fall back to the maintenance socket, which accepts CQL locally with full permissions.
# See https://docs.scylladb.com/manual/stable/operating-scylla/admin-tools/maintenance-socket.html
- name: Look for the maintenance socket
  stat:
    path: "{{ scylla_maintenance_socket_path }}"
  become: true
  register: _maintenance_socket_stat
  when: scylla_admin_default_user is not defined
  run_once: true

- fail:
    msg: >-
      No way to run CQL as a superuser on this cluster: either define 'scylla_admin_default_user'
      together with a matching entry in the 'cql_credentials' inventory section, or enable the
      maintenance socket through 'scylla_maintenance_socket' (currently
      '{{ scylla_maintenance_socket }}') and restart the node.
  when:
    - scylla_admin_default_user is not defined
    - not _maintenance_socket_stat.stat.exists
  run_once: true

- name: Adjust replication for {{ _keyspace }} keyspace
  shell: |
    cqlsh {{ _cqlsh_admin_target }} -e "ALTER KEYSPACE {{ _keyspace }} WITH replication = {'class': '{{ _keyspace_replication_strategy }}', {{ dcs_to_rf | unique | join(',') }}};"
  become: true
  run_once: true
  vars:
    _cqlsh_admin_target: "{% if scylla_admin_default_user is defined %}{{ broadcast_address }} -u '{{ scylla_admin_username }}' -p '{{ scylla_admin_password }}'{% else %}{{ scylla_maintenance_socket_path }}{% endif %}"

- name: Run cleanup for keyspace {{ _keyspace }}
  async_task:
    shell: |
      nodetool cleanup {{ _keyspace }}
    alias: scylla_cleanup
    async: "{{ cleanup_timeout_seconds }}"
    retries: "{{ cleanup_timeout_seconds // 30 }}" # retries = cleanup_timeout_seconds / delay
    delay: 30
  register: _cleanup_output

- name: Cleanup logs
  debug: var=_cleanup_output

- name: Run repair for keyspace {{ _keyspace }}
  include_tasks: repair.yml
  vars:
    keyspace: '{{ _keyspace }}'
