---
name: Molecule Test for ansible roles
on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'ansible-scylla-node/**'
      - 'ansible-scylla-monitoring/**'
      - 'ansible-scylla-manager/**'
      - 'molecule/**'
      - '.github/workflows/test-roles.yml'
  pull_request:
    paths:
      - 'ansible-scylla-node/**'
      - 'ansible-scylla-monitoring/**'
      - 'ansible-scylla-manager/**'
      - 'molecule/**'
      - '.github/workflows/test-roles.yml'
    branches:
      - master
      - dev
jobs:
  # Full matrix on master; reduced set on dev to cut runner load.
  select-distros:
    runs-on: self-hosted
    outputs:
      molecule_distro: ${{ steps.set.outputs.molecule_distro }}
    steps:
      - id: set
        run: |
          # PR → base_ref; push → ref_name
          target="${{ github.base_ref || github.ref_name }}"
          if [ "$target" = "master" ]; then
            echo 'molecule_distro=["debian11","debian12","ubuntu2204","ubuntu2404","rockylinux9","rockylinux10"]' >> "$GITHUB_OUTPUT"
          else
            echo 'molecule_distro=["debian12","ubuntu2404","rockylinux10"]' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: select-distros
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        molecule_distro: ${{ fromJson(needs.select-distros.outputs.molecule_distro) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - name: Set up Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.2 pip-tools
          pip-sync requirements.txt requirements-dev.txt
          ansible-galaxy collection install community.docker
          ansible --version
          molecule --version
      - name: Test with molecule
        run: |
          molecule destroy --scenario-name ${{ matrix.molecule_distro }} && molecule test --scenario-name ${{ matrix.molecule_distro }}
      # ANSROLES-20: molecule destroy drops scylla-monitor-node but keeps its named
      # DinD volume (molecule-dind-<distro>-<run_id>). Remove explicitly so runner disk
      # does not fill. Warn (do not swallow) if removal fails for a real reason.
      - name: Remove molecule DinD volume
        if: always()
        run: |
          volume="molecule-dind-${{ matrix.molecule_distro }}-${{ github.run_id }}"
          docker volume rm -f "$volume" || echo "::warning::failed to remove volume $volume"
