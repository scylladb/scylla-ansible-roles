---
# Upgrade Scylla Manager server and scylla-manager-agent on all scylla nodes.
#
# scylla_manager_{deb,rpm}_repo_url should point at the target series, set in the params
# files (group_vars); extra-vars override them.
# Recommended: --tags manager_agent_upgrade, which limits the node role to its manager-agent
# tasks; the other plays are tagged always, so they keep running under any --tags selection.
# Default (no --tags): full ansible-scylla-node.

- name: Suspend Scylla Manager tasks and stop the server
  hosts: scylla-manager
  any_errors_fatal: true
  gather_facts: no
  tags:
    - always
  tasks:
    - name: Require scylla_clusters with cluster_name on every entry
      ansible.builtin.assert:
        that:
          - scylla_clusters is defined
          - scylla_clusters | length > 0
          - scylla_clusters | map(attribute='cluster_name') | select('defined') | list | length
              == (scylla_clusters | length)
        fail_msg: >-
          scylla_clusters must be a non-empty list and every entry must have cluster_name for sctool.

    - name: Manager unit state
      ansible.builtin.command: systemctl is-active scylla-manager
      register: manager_active
      changed_when: false
      failed_when: false

    - name: Suspend tasks
      ansible.builtin.shell: sctool --cluster="{{ item.cluster_name }}" suspend
      loop: "{{ scylla_clusters }}"
      loop_control:
        label: "{{ item.cluster_name }}"
      when: manager_active.stdout == "active"

    - name: Stop scylla-manager
      ansible.builtin.systemd:
        name: scylla-manager
        state: stopped
      become: true

- name: Stop Scylla Manager agents
  hosts: scylla
  any_errors_fatal: true
  gather_facts: no
  become: true
  tags:
    - always
  tasks:
    - name: Stop scylla-manager-agent
      ansible.builtin.systemd:
        name: scylla-manager-agent
        state: stopped

# Package upgrade only, through the role's OS tasks file. The role's main.yml would also
# restart scylla-manager and run sctool cluster add/update while every agent is stopped.
- name: Upgrade Scylla Manager server and client
  hosts: scylla-manager
  any_errors_fatal: true
  tags:
    - always
  tasks:
    - name: Upgrade scylla-manager-server and scylla-manager-client
      ansible.builtin.include_role:
        name: ansible-scylla-manager
        tasks_from: "{{ ansible_os_family }}.yml"
      vars:
        enable_upgrade: true
        skip_role_deps: true

# No play-level tags here: they are inherited by every task of the role and would
# defeat the manager_agent_upgrade tags inside it.
- name: Upgrade manager agents via ansible-scylla-node
  hosts: scylla
  any_errors_fatal: true
  vars:
    scylla_manager_agent_upgrade: true
    start_scylla_service: false
  roles:
    - ansible-scylla-node

- name: Setup and start Scylla Manager agents
  hosts: scylla
  any_errors_fatal: true
  gather_facts: no
  become: true
  tags:
    - always
  tasks:
    - name: scyllamgr_agent_setup -y
      ansible.builtin.command: scyllamgr_agent_setup -y

    - name: Start scylla-manager-agent
      ansible.builtin.systemd:
        name: scylla-manager-agent
        state: started
        enabled: true

- name: Start Scylla Manager server
  hosts: scylla-manager
  any_errors_fatal: true
  gather_facts: no
  become: true
  tags:
    - always
  tasks:
    # Restarts and enables scylla-manager, then waits for its API port(s) to come up,
    # so the resume below doesn't race the restart.
    - name: Start scylla-manager and wait for it to become operational
      ansible.builtin.include_role:
        name: ansible-scylla-manager
        tasks_from: start_manager.yml
      vars:
        skip_role_deps: true

- name: Resume Scylla Manager tasks
  hosts: scylla-manager
  any_errors_fatal: true
  gather_facts: no
  tags:
    - always
  tasks:
    - name: Resume tasks
      ansible.builtin.shell: sctool --cluster="{{ item.cluster_name }}" resume --start-tasks --start-tasks-missed-activation
      loop: "{{ scylla_clusters }}"
      loop_control:
        label: "{{ item.cluster_name }}"
