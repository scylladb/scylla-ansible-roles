---
# Creates a CQL user, (re)sets its password and grants it permissions.
# ansible-scylla-common is referenced by path, so that this runs from a checkout of the repository without a roles
# path being configured.
#
# Expects the following variables to be set by the caller:
#   * cql_address, cql_port: where to reach a node when logging in as a user.
#   * cql_username, cql_password: the superuser to log in as. If cql_username is empty, the maintenance socket is used.
#   * cql_maintenance_socket: the path of the maintenance socket, used when there is no cql_username.
#   * username: the name of the user to create.
#   * password: the password to set for the user, both on creation and on every later run.
#   * superuser: a boolean telling whether the user gets the SUPERUSER role attribute.
#   * permissions: an optional list of '[permission, resource]' pairs to grant to the user.
- name: Create user {{ username }}
  block:
  - name: Create the user
    import_role:
      name: ansible-scylla-common
      tasks_from: run_cqlsh.yml
    vars:
      cql_statement: "CREATE USER IF NOT EXISTS '{{ username }}' WITH PASSWORD '{{ password }}' {{ 'SUPERUSER' if superuser|bool else 'NOSUPERUSER' }};"

  - name: Set the password of the user
    import_role:
      name: ansible-scylla-common
      tasks_from: run_cqlsh.yml
    vars:
      cql_statement: "ALTER ROLE '{{ username }}' WITH PASSWORD = '{{ password }}'"
  vars:
    cql_host: "{{ cql_address }}"

- name: Grant permissions
  include_role:
    name: ansible-scylla-common
    tasks_from: run_cqlsh.yml
  vars:
    cql_statement: "GRANT {{ outer_item[0] }} on {{ outer_item[1] }} to '{{ username }}';"
    cql_host: "{{ cql_address }}"
  loop: "{{ permissions | list }}"
  loop_control:
    loop_var: outer_item
  when: permissions is defined
